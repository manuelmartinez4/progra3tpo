spring.application.name=tpo-prog3

# --- Conexion a Neo4j -------------------------------------------------------
# NUNCA escribir la password aca. Se toma de variables de entorno o del
# archivo .env de la raiz del proyecto (esta en .gitignore).
# Local:  NEO4J_URI=bolt://localhost:7687
# Aura:   NEO4J_URI=neo4j+s://xxxxxxx.databases.neo4j.io
spring.config.import=optional:file:.env[.properties]
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USER:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:}

# --- Carga de datos del dominio --------------------------------------------
# Sincroniza la red logistica (8 lugares, 12 caminos) y los 5 paquetes.
# Es idempotente: al reiniciar no duplica nodos, relaciones ni paquetes.
app.seed.enabled=${APP_SEED_ENABLED:true}
# Los nodos e items que no son del dominio (por ejemplo, los de la semilla
# generica del scaffold) se borran, porque alterarian los resultados. Con
# false solo se informan en el log. Usar una base de desarrollo dedicada.
app.seed.eliminar-ajenos=${APP_SEED_ELIMINAR_AJENOS:true}

# --- Errores ----------------------------------------------------------------
server.error.include-stacktrace=never

# --- Logging ----------------------------------------------------------------
logging.level.uade.prog3.tpo=INFO
